name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Run core JVM unit tests
        run: ./gradlew --no-daemon --console=plain :core:test

      - name: Assemble Debug & Release APKs
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug :app:assembleRelease

      - name: Upload unit test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: core/build/reports/tests/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: HearthLog-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
